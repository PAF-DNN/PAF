# Model Registry Configuration
# 
# Define all available models here - NO code changes needed!
# Just add new models to this file and use them in training_config.yaml
#
# To add a new model:
# 1. Add a new section below with the model name
# 2. Specify class_name, module, and modifications
# 3. Use it in training_config.yaml by setting: model: model_name
#
# That's it! No Python code changes needed!

models:
  # ─────────────────────────────────────────────────────────────────────
  # ResNet variants (from torchvision)
  # ─────────────────────────────────────────────────────────────────────
  
  resnet18:
    class_name: resnet18
    module: torchvision.models
    pretrained_param: pretrained
    description: "ResNet-18: 18-layer residual network"
    modifications:
      fc:
        type: linear
        in_features_from: "fc.in_features"
    # Preprocessing config (used if pretrained=true)
    preprocessing:
      imagenet:  # Dataset name
        resize: 256
        center_crop: 224
        normalize:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      cifar10:
        resize: 32
        normalize:
          mean: [0.4914, 0.4822, 0.4465]
          std: [0.2023, 0.1994, 0.2010]

  resnet34:
    class_name: resnet34
