# ─────────────────────────────────────────────────────────────────────
# HOW TO ADD A NEW MODEL (Example)
# ─────────────────────────────────────────────────────────────────────
#
# 1. Copy one of the examples above
# 2. Modify with your model:
#
#   my_model:
#     class_name: MyModel
#     module: my_package.models
#     pretrained_param: pretrained
#     description: "My model description"
#     modifications:
#       fc_layer:  # Your layer name
#         type: linear
#         in_features_from: "fc_layer.in_features"
#
# 3. Use in training_config.yaml:
#   model: my_model
#
# 4. That's it! No Python code changes needed!